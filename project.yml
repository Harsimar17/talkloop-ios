# XcodeGen spec: `brew install xcodegen && xcodegen` in this folder makes Talkloop.xcodeproj.
name: Talkloop
options:
  bundleIdPrefix: com.vocabtrainer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Talkloop:
    type: application
    platform: iOS
    sources:
      - Sources/Talkloop
      - Resources/Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Talkloop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Talkloop listens while you speak German with your AI partner.
        NSSpeechRecognitionUsageDescription: Talkloop turns what you say into text so your partner can answer and correct it.
        # Keeps a live voice call going with the screen locked, like a phone call.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocabtrainer.talkloop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
