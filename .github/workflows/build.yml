# Builds the Talkloop iPhone app on a GitHub Mac and uploads an unsigned Talkloop.ipa.
# Sign and install it with a sideloader such as iloader or SideStore (it signs with your Apple ID).
name: Build Talkloop.ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Talkloop.xcodeproj \
            -target Talkloop \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*(deprecated|will never)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/Talkloop.app

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100 || true

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Talkloop.app Payload/
          zip -qry Talkloop.ipa Payload
          ls -lh Talkloop.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Talkloop-ipa
          path: Talkloop.ipa
          retention-days: 30
